# Goes inside the chza.me *:443 VirtualHost (chza.me-le-ssl.conf), BEFORE "ProxyPass / http://localhost:8081/".
RewriteRule ^/dance$ /dance/ [R=301,L]
ProxyPass        /dance/ http://127.0.0.1:8031/ timeout=300
ProxyPassReverse /dance/ http://127.0.0.1:8031/

# Dev copy (deploy/dev.sh), same place:
RewriteRule ^/dance-dev$ /dance-dev/ [R=301,L]
ProxyPass        /dance-dev/ http://127.0.0.1:8033/ timeout=300
ProxyPassReverse /dance-dev/ http://127.0.0.1:8033/
