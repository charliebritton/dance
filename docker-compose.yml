# Production on the chza.me VPS. Apache proxies https://chza.me/dance/ to 127.0.0.1:8031 (see deploy/apache-dance.conf).
name: dance

services:
  app:
    build: { context: ., dockerfile: deploy/Dockerfile }
    image: rise-and-fall:latest
    env_file: .env
    volumes:
      - ./data:/app/data
    ports:
      - "127.0.0.1:8031:8031"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8031/api/syllabus')"]
      interval: 30s
      timeout: 5s
      retries: 3
